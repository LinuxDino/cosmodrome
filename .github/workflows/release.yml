name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write   # lets npm verify this workflow (trusted publishing + provenance)
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11   # trusted publishing needs npm 11.5.1 or newer
      - name: Check version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if npm view "cosmodrome@$version" version >/dev/null 2>&1; then
            echo "::notice::cosmodrome@$version is already on npm - nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.skip != 'true'
        run: npm test
      - if: steps.version.outputs.skip != 'true'
        run: npm publish --provenance --access public
